name: Earnings-Kalender aktualisieren

on:
  schedule:
    # Zeiten in UTC, Mo-Fr. Ergebnisse erscheinen beim jeweils nächsten Lauf.
    - cron: "15 6 * * 1-5"    # früh: europäische und asiatische Meldungen
    - cron: "15 12 * * 1-5"   # Mittag
    - cron: "45 14 * * 1-5"   # nach den vorbörslichen US-Zahlen
    - cron: "45 22 * * 1-5"   # nach US-Börsenschluss und den nachbörslichen Zahlen
    - cron: "15 2 * * 2-6"    # nachts: Nachzügler vom Vorabend
  workflow_dispatch: {}        # manuell starten: Actions -> "Run workflow"

permissions:
  contents: write              # zum Speichern von data/state.json

concurrency:
  group: earnings-kalender
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Kalender erzeugen
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # optional
        run: python -m ecal.build

      - name: Im Gist veröffentlichen
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python -m ecal.publish

      - name: Status speichern
        run: |
          git config user.name "earnings-bot"
          git config user.email "earnings-bot@users.noreply.github.com"
          git add data output/report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update $(date -u +%Y-%m-%d_%H%M)"
          git pull --rebase -X theirs origin main
          git push
